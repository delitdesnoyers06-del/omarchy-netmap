[package]
name = "netmap"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Local network map: mDNS/DNS-SD discovery, ARP, mass-parallel port scan with protocol identification"
license = "MIT"

[[bin]]
name = "netmap"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
mdns-sd = "0.21"
if-addrs = "0.15"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
